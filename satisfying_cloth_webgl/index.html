<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satin Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0a;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #replace{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font:500 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;cursor:pointer;opacity:.45;transition:opacity .2s}
  #replace:hover{opacity:.95}
  #msg{position:fixed;left:0;right:0;top:12px;text-align:center;color:#ccc;font:12px sans-serif;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="replace" type="button">Replace image</button>
<input id="file" type="file" accept="image/*" hidden>
<div id="msg">WebGL2 is unavailable, showing a flat preview.</div>
<script>
(function () {
'use strict';

/* ============================== CONFIG ==============================
   Everything customizable lives here.
   artwork.type : "image" | "gradient" | "solid"
   artwork.src  : image URL. Leave "" to use the bundled photo (bottom of file);
                  set to "none" for the generated landscape.
   URL params   : ?img= ?bg= ?plate= ?title=  override the values below.
   ==================================================================== */
const CONFIG = {
  artwork: { type: "image", src: "", fit: "cover", focal: [0.5, 0.45], stops: ["#d9cdb4", "#8a8f6a", "#3b4630"], angle: 180, color: "#1c2b4a" },
  colors: { stage: "#0a0a0a", plateFrom: "#ece1c5", plateMid: "#dccfa8", plateTo: "#cdbf98", ink: "#2a2620", sheen: "#fff0cc", sheenAccent: "#ffb8ea", artworkOverlay: "rgba(236,226,206,0.14)" },
  text: { title: "WANDERLUST", subtitle: "POSTER NAME", logo: "Studio", indexLeft: "072", indexRight: "28/11", labelTopLeft: "POSTER SERIES", labelTopRight: "PLATE 072", footerLeft: "17/37", footerRight: "28/03" },
  physics: { stiffness: 0.014, damping: 0.975, grabRadius: 0.2, lift: [70, 180], iterations: 5, introRipple: true },
  shading: { glossiness: 38, ambient: 0.42, light: [-0.45, -0.6, 0.75], iridescence: 0.8, perspective: 1300 },
  grid: [36, 34]
};

/* ---------- URL parameters ---------- */
(function () {
  const q = new URLSearchParams(location.search);
  const hex = v => (/^[0-9a-f]{3,8}$/i.test(v) ? "#" + v : v);
  if (q.get("img")) { CONFIG.artwork.type = "image"; CONFIG.artwork.src = q.get("img"); }
  if (q.get("bg")) CONFIG.colors.stage = hex(q.get("bg"));
  if (q.get("plate")) { const p = hex(q.get("plate")); CONFIG.colors.plateFrom = CONFIG.colors.plateMid = CONFIG.colors.plateTo = p; }
  if (q.get("title")) CONFIG.text.title = q.get("title");
})();

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduced) { CONFIG.physics.introRipple = false; CONFIG.physics.lift = CONFIG.physics.lift.map(v => v * 0.5); }

const DW = 864, DH = 830;            // design units of the poster
const BAND_Y = 160, BAND_H = 510;    // artwork band in design units
const cv = document.getElementById("c");
const gl = cv.getContext("webgl2", { antialias: true, alpha: false });
document.body.style.background = CONFIG.colors.stage;

/* ============================== LAYOUT ============================== */
let dpr = 1, vw = 0, vh = 0, px = 0, py = 0, pw = 0, ph = 0;
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  let w = vw * 0.88, h = w * DH / DW;
  if (h > vh * 0.6) { h = vh * 0.6; w = h * DW / DH; }
  pw = w; ph = h; px = (vw - w) / 2; py = (vh - h) / 2;
}

/* ============================== ARTWORK ============================== */
let artImg = null;
function loadArtwork(src, cb) {
  if (!src || src === "none") { artImg = null; cb && cb(); return; }
  const im = new Image();
  if (!/^(data|blob):/.test(src)) im.crossOrigin = "anonymous";
  im.onload = () => { artImg = im; cb && cb(); };
  im.onerror = () => { artImg = null; cb && cb(); };
  im.src = src;
}
function loadFile(file) {
  if (!file || !/^image\//.test(file.type)) return;
  const fr = new FileReader();
  fr.onload = () => { CONFIG.artwork.type = "image"; loadArtwork(fr.result, () => { buildTexture(); uploadTexture(); }); };
  fr.readAsDataURL(file);
}

/* ============================== TEXTURE ============================== */
const tex2d = document.createElement("canvas");
const tctx = tex2d.getContext("2d");

function mirror(p) { return [DW - p[0], p[1]]; }
function outline(top, bot) {
  return top.concat(top.slice().reverse().map(mirror), bot.map(mirror), bot.slice().reverse());
}
const TOP_PLATE = outline(
  [[0,50],[16,34],[60,34],[60,8],[250,8],[250,34],[330,34],[330,48],[392,48],[392,30],[432,30]],
  [[0,146],[14,162],[200,162],[200,170],[432,170]]);
const BOT_PLATE = outline(
  [[0,676],[14,660],[150,660],[150,668],[300,668],[300,650],[392,650],[392,664],[432,664]],
  [[0,812],[18,830],[432,830]]);

function fillPlate(ctx, pts, y0, y1) {
  const c = CONFIG.colors;
  const g = ctx.createLinearGradient(0, y0, DW, y1);
  g.addColorStop(0, c.plateFrom); g.addColorStop(0.5, c.plateMid); g.addColorStop(1, c.plateTo);
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  ctx.fillStyle = g; ctx.strokeStyle = g; ctx.lineJoin = "round"; ctx.lineWidth = 14;
  ctx.fill(); ctx.stroke();
}
function star(ctx, x, y, r, col) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col; ctx.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * 0.28 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function eye(ctx, x, y, col) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-16, 0); ctx.quadraticCurveTo(0, -15, 16, 0); ctx.quadraticCurveTo(0, 15, -16, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, 7); ctx.fill(); ctx.restore();
}
function checker(ctx, x, y, col) {
  ctx.fillStyle = col;
  for (let j = 0; j < 2; j++) for (let i = 0; i < 6; i++) if ((i + j) % 2 === 0) ctx.fillRect(x + i * 8, y + j * 8, 8, 8);
}
function dots(ctx, x, y, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.arc(x + 9, y, 2.2, 0, 7); ctx.fill(); }
function txt(ctx, s, x, y, font, align, spacing) {
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = "middle";
  if ("letterSpacing" in ctx) ctx.letterSpacing = spacing || "0px";
  ctx.fillText(s, x, y);
}

function drawLandscape(ctx, w, h) {
  let g = ctx.createLinearGradient(0, 0, 0, h * 0.62);
  g.addColorStop(0, "#c9d3d6"); g.addColorStop(0.6, "#efe3cd"); g.addColorStop(1, "#f6d9b6");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  g = ctx.createRadialGradient(w * 0.62, h * 0.4, 5, w * 0.62, h * 0.4, h * 0.45);
  g.addColorStop(0, "rgba(255,244,214,.95)"); g.addColorStop(1, "rgba(255,244,214,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const hills = [["#b6bda4", 0.5, 0.06], ["#97a083", 0.56, 0.09], ["#6e7a5c", 0.62, 0.07]];
  hills.forEach(([col, y, a], n) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 12) ctx.lineTo(x, h * y - Math.sin(x * 0.006 + n * 2) * h * a - Math.sin(x * 0.017 + n) * h * 0.02);
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  });
  g = ctx.createLinearGradient(0, h * 0.64, 0, h * 0.85);
  g.addColorStop(0, "#d9d7c6"); g.addColorStop(1, "#8c9a8a");
  ctx.fillStyle = g; ctx.fillRect(0, h * 0.64, w, h * 0.21);
  ctx.fillStyle = "#2c3523"; ctx.fillRect(0, h * 0.85, w, h * 0.15);
  for (let x = -20; x < w + 40; x += 38) {
    const th = h * (0.22 + 0.12 * Math.abs(Math.sin(x * 0.07)));
    for (let t = 0; t < 3; t++) {
      ctx.beginPath(); ctx.moveTo(x, h * 0.88 - th + t * th * 0.28);
      ctx.lineTo(x - 26 + t * 3, h * 0.88 - th * 0.55 + t * th * 0.3); ctx.lineTo(x + 26 - t * 3, h * 0.88 - th * 0.55 + t * th * 0.3);
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawArtwork(ctx) {
  const a = CONFIG.artwork, w = DW, h = BAND_H;
  ctx.save(); ctx.translate(0, BAND_Y); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
  if (a.type === "solid") { ctx.fillStyle = a.color; ctx.fillRect(0, 0, w, h); }
  else if (a.type === "gradient") {
    const r = a.angle * Math.PI / 180, dx = Math.sin(r), dy = -Math.cos(r), L = Math.abs(w * dx) + Math.abs(h * dy);
    const g = ctx.createLinearGradient(w / 2 - dx * L / 2, h / 2 - dy * L / 2, w / 2 + dx * L / 2, h / 2 + dy * L / 2);
    a.stops.forEach((c, i) => g.addColorStop(i / Math.max(1, a.stops.length - 1), c));
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  } else if (artImg) {
    const iw = artImg.naturalWidth || artImg.width, ih = artImg.naturalHeight || artImg.height;
    const s = a.fit === "contain" ? Math.min(w / iw, h / ih) : Math.max(w / iw, h / ih);
    const dw = iw * s, dh = ih * s;
    ctx.drawImage(artImg, (w - dw) * a.focal[0], (h - dh) * a.focal[1], dw, dh);
  } else drawLandscape(ctx, w, h);
  ctx.fillStyle = CONFIG.colors.artworkOverlay; ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

function buildTexture() {
  const k = 1.7;
  tex2d.width = Math.max(2, Math.round(pw * k)); tex2d.height = Math.max(2, Math.round(ph * k));
  const ctx = tctx, T = CONFIG.text, ink = CONFIG.colors.ink;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, tex2d.width, tex2d.height);
  ctx.setTransform(tex2d.width / DW, 0, 0, tex2d.height / DH, 0, 0);
  drawArtwork(ctx);

  // top plate
  fillPlate(ctx, TOP_PLATE, 0, 170);
  ctx.fillStyle = ink;
  txt(ctx, T.logo, 92, 98, '600 26px Inter, sans-serif', "left", "1px");
  txt(ctx, "*", 74, 104, '600 34px Inter, sans-serif', "center");
  txt(ctx, T.labelTopLeft, 78, 22, '500 10px Inter, sans-serif', "left", "2px");
  txt(ctx, T.labelTopRight, DW - 78, 22, '500 10px Inter, sans-serif', "right", "2px");
  eye(ctx, 250, 108, ink); eye(ctx, DW - 250, 108, ink);
  checker(ctx, 290, 100, ink); checker(ctx, DW - 338, 100, ink);
  dots(ctx, 92, 140, ink); dots(ctx, DW - 101, 140, ink);
  dots(ctx, 410, 62, ink); dots(ctx, 445, 62, ink);

  // bottom plate
  fillPlate(ctx, BOT_PLATE, 650, 830);
  ctx.fillStyle = ink;
  let fs = 84; ctx.font = '300 ' + fs + 'px "Cormorant Garamond", Georgia, serif';
  const tw = ctx.measureText(T.title).width; if (tw > 560) fs = Math.floor(fs * 560 / tw);
  txt(ctx, T.title, DW / 2, 745, '300 ' + fs + 'px "Cormorant Garamond", Georgia, serif', "center", "4px");
  txt(ctx, "+", 118, 745, '300 30px "Cormorant Garamond", Georgia, serif', "center");
  txt(ctx, "+", DW - 118, 745, '300 30px "Cormorant Garamond", Georgia, serif', "center");
  txt(ctx, T.subtitle, DW / 2, 792, '500 12px Inter, sans-serif', "center", "4px");
  txt(ctx, T.indexLeft, 50, 700, '400 30px "Cormorant Garamond", Georgia, serif', "left");
  txt(ctx, T.indexRight, DW - 50, 700, '400 30px "Cormorant Garamond", Georgia, serif', "right");
  star(ctx, 36, 790, 11, ink); star(ctx, DW - 36, 790, 11, ink);
  txt(ctx, T.footerLeft, 70, 808, '500 10px Inter, sans-serif', "left", "2px");
  txt(ctx, T.footerRight, DW - 70, 808, '500 10px Inter, sans-serif', "right", "2px");
  dots(ctx, 150, 808, ink); dots(ctx, DW - 160, 808, ink);
}

/* ============================== PHYSICS ============================== */
const cols = CONFIG.grid[0], rows = CONFIG.grid[1], NP = cols * rows;
let P, Q, R, ia, ib, il, ik, NC;
let grab = null;           // {n, idx, w, bx, by, bz, sx, sy, dx, dy}
const ptr = { x: 0, y: 0, lx: 0, ly: 0, has: false };

function initSim() {
  P = new Float32Array(NP * 3); Q = new Float32Array(NP * 3); R = new Float32Array(NP * 3);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const k = (j * cols + i) * 3, x = px + i / (cols - 1) * pw, y = py + j / (rows - 1) * ph;
    R[k] = P[k] = Q[k] = x; R[k + 1] = P[k + 1] = Q[k + 1] = y; R[k + 2] = P[k + 2] = Q[k + 2] = 0;
    if (CONFIG.physics.introRipple) Q[k + 2] = (70 / 60) * Math.sin(i * 0.4 + j * 0.3);
  }
  const A = [], B = [], K = [];
  const add = (i0, j0, i1, j1, s) => { A.push(j0 * cols + i0); B.push(j1 * cols + i1); K.push(s); };
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    if (i < cols - 1) add(i, j, i + 1, j, 0.9);
    if (j < rows - 1) add(i, j, i, j + 1, 0.9);
    if (i < cols - 1 && j < rows - 1) { add(i, j, i + 1, j + 1, 0.5); add(i + 1, j, i, j + 1, 0.5); }
    if (i < cols - 2) add(i, j, i + 2, j, 0.1);
    if (j < rows - 2) add(i, j, i, j + 2, 0.1);
  }
  NC = A.length; ia = Int32Array.from(A); ib = Int32Array.from(B); ik = Float32Array.from(K); il = new Float32Array(NC);
  for (let c = 0; c < NC; c++) {
    const a = ia[c] * 3, b = ib[c] * 3;
    il[c] = Math.hypot(R[a] - R[b], R[a + 1] - R[b + 1]);
  }
  grab = null;
}

function startGrab(x, y) {
  const r = CONFIG.physics.grabRadius * pw, r2 = r * r, idx = [], w = [];
  for (let k = 0; k < NP; k++) {
    const dx = P[k * 3] - x, dy = P[k * 3 + 1] - y, wt = Math.exp(-(dx * dx + dy * dy) / r2);
    if (wt > 0.03) { idx.push(k); w.push(wt); }
  }
  if (!idx.length) return;
  const n = idx.length, g = { n, idx: Int32Array.from(idx), w: Float32Array.from(w), bx: new Float32Array(n), by: new Float32Array(n), bz: new Float32Array(n), sx: x, sy: y, dx: 0, dy: 0 };
  for (let m = 0; m < n; m++) { const k = idx[m] * 3; g.bx[m] = P[k]; g.by[m] = P[k + 1]; g.bz[m] = P[k + 2]; }
  grab = g;
}

function hover(x, y, vx, vy) {
  const r = CONFIG.physics.grabRadius * pw * 0.7, r2 = r * r;
  vx = Math.max(-40, Math.min(40, vx)); vy = Math.max(-40, Math.min(40, vy));
  for (let k = 0; k < NP; k++) {
    const dx = R[k * 3] - x, dy = R[k * 3 + 1] - y, d2 = dx * dx + dy * dy;
    if (d2 > r2 * 4) continue;
    const w = Math.exp(-d2 / r2);
    if (w < 0.05) continue;
    P[k * 3] += vx * w * 0.2; P[k * 3 + 1] += vy * w * 0.2; P[k * 3 + 2] += w * 2.5;
  }
}

function step() {
  const ph_ = CONFIG.physics, damp = ph_.damping, st = ph_.stiffness;
  for (let i = 0; i < NP * 3; i++) {
    const p = P[i], v = (p - Q[i]) * damp;
    Q[i] = p; P[i] = p + v + (R[i] - p) * st;
  }
  const l0 = ph_.lift[0], l1 = ph_.lift[1];
  for (let it = 0; it < ph_.iterations; it++) {
    for (let c = 0; c < NC; c++) {
      const a = ia[c] * 3, b = ib[c] * 3;
      const dx = P[b] - P[a], dy = P[b + 1] - P[a + 1], dz = P[b + 2] - P[a + 2];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < 1e-6) continue;
      const f = (d - il[c]) / d * ik[c] * 0.5;
      P[a] += dx * f; P[a + 1] += dy * f; P[a + 2] += dz * f;
      P[b] -= dx * f; P[b + 1] -= dy * f; P[b + 2] -= dz * f;
    }
    if (grab) {
      const g = grab, dist = Math.hypot(g.dx, g.dy), lift = l0 + Math.min(l1 - l0, dist * 0.35);
      for (let m = 0; m < g.n; m++) {
        const k = g.idx[m] * 3, w = g.w[m], s = w * 0.4;
        P[k] += (g.bx[m] + g.dx - P[k]) * s;
        P[k + 1] += (g.by[m] + g.dy - P[k + 1]) * s;
        P[k + 2] += (g.bz[m] + w * lift - P[k + 2]) * s;
      }
    }
  }
}

/* ============================== WEBGL ============================== */
let prog, vao, bufPos, bufNrm, texture, U = {}, N, nCount, idxCount;

const VS = `#version 300 es
in vec3 aP; in vec3 aN; in vec2 aUV;
uniform vec2 uRes; uniform float uF;
out vec3 vN; out vec2 vUV;
void main(){
  float s = uF / (uF - aP.z);
  vec2 c = uRes * 0.5;
  vec2 xy = c + (aP.xy - c) * s;
  gl_Position = vec4(xy.x / uRes.x * 2.0 - 1.0, 1.0 - xy.y / uRes.y * 2.0, -aP.z / 4000.0, 1.0);
  vN = aN; vUV = aUV;
}`;
const FS = `#version 300 es
precision highp float;
in vec3 vN; in vec2 vUV;
uniform sampler2D uTex; uniform vec3 uL; uniform float uGloss, uAmb, uIri; uniform vec3 uSheen, uAccent;
out vec4 o;
void main(){
  vec4 t = texture(uTex, vUV);
  if (t.a < 0.02) discard;
  vec3 n = normalize(vN); float back = 1.0;
  if (n.z < 0.0) { n = -n; back = 0.82; }
  float d = max(dot(n, uL), 0.0);
  float flatL = uAmb + (1.0 - uAmb) * max(uL.z, 0.0);
  float lit = (uAmb + (1.0 - uAmb) * d) / flatL;
  vec3 H = normalize(uL + vec3(0.0, 0.0, 1.0));
  float nh = max(dot(n, H), 0.0);
  float spec = pow(nh, uGloss), soft = pow(nh, 7.0);
  float k = clamp(0.5 + n.x * uIri * 2.5, 0.0, 1.0);
  vec3 tint = mix(uSheen, uAccent, k);
  vec3 c = t.rgb * lit + tint * (spec * 0.55 + soft * 0.12);
  c *= 1.0 + 0.05 * (0.5 - vUV.y) + 0.03 * (vUV.x - 0.5);
  o = vec4(c * back, t.a);
}`;

function hexRGB(h) {
  const m = document.createElement("canvas").getContext("2d"); m.fillStyle = h; const s = m.fillStyle;
  if (s[0] === "#") return [1, 3, 5].map(i => parseInt(s.substr(i, 2), 16) / 255);
  return (s.match(/[\d.]+/g) || [0, 0, 0]).slice(0, 3).map(v => v / 255);
}
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function initGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  ["uRes","uF","uTex","uL","uGloss","uAmb","uIri","uSheen","uAccent"].forEach(n => U[n] = gl.getUniformLocation(prog, n));
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);

  bufPos = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufPos);
  gl.bufferData(gl.ARRAY_BUFFER, NP * 12, gl.DYNAMIC_DRAW);
  const lp = gl.getAttribLocation(prog, "aP"); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 3, gl.FLOAT, false, 0, 0);

  N = new Float32Array(NP * 3);
  bufNrm = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufNrm);
  gl.bufferData(gl.ARRAY_BUFFER, NP * 12, gl.DYNAMIC_DRAW);
  const ln = gl.getAttribLocation(prog, "aN"); gl.enableVertexAttribArray(ln); gl.vertexAttribPointer(ln, 3, gl.FLOAT, false, 0, 0);

  const uv = new Float32Array(NP * 2);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { uv[(j * cols + i) * 2] = i / (cols - 1); uv[(j * cols + i) * 2 + 1] = j / (rows - 1); }
  const bu = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bu); gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
  const lu = gl.getAttribLocation(prog, "aUV"); gl.enableVertexAttribArray(lu); gl.vertexAttribPointer(lu, 2, gl.FLOAT, false, 0, 0);

  const ix = new Uint16Array((cols - 1) * (rows - 1) * 6); let n = 0;
  for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
    const a = j * cols + i, b = a + 1, c = a + cols, d = c + 1;
    ix[n++] = a; ix[n++] = c; ix[n++] = b; ix[n++] = b; ix[n++] = c; ix[n++] = d;
  }
  idxCount = n;
  const be = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, be); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ix, gl.STATIC_DRAW);

  texture = gl.createTexture();
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);

  const S = CONFIG.shading, L = S.light, ll = Math.hypot(L[0], L[1], L[2]);
  gl.useProgram(prog);
  gl.uniform3f(U.uL, L[0] / ll, L[1] / ll, L[2] / ll);
  gl.uniform1f(U.uGloss, S.glossiness); gl.uniform1f(U.uAmb, S.ambient); gl.uniform1f(U.uIri, S.iridescence);
  gl.uniform1f(U.uF, S.perspective); gl.uniform1i(U.uTex, 0);
  gl.uniform3fv(U.uSheen, hexRGB(CONFIG.colors.sheen)); gl.uniform3fv(U.uAccent, hexRGB(CONFIG.colors.sheenAccent));
}

function uploadTexture() {
  if (!gl) { draw2D(); return; }
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex2d);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

function computeNormals() {
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const l = (j * cols + Math.max(i - 1, 0)) * 3, r = (j * cols + Math.min(i + 1, cols - 1)) * 3;
    const u = (Math.max(j - 1, 0) * cols + i) * 3, d = (Math.min(j + 1, rows - 1) * cols + i) * 3;
    const ax = P[r] - P[l], ay = P[r + 1] - P[l + 1], az = P[r + 2] - P[l + 2];
    const bx = P[d] - P[u], by = P[d + 1] - P[u + 1], bz = P[d + 2] - P[u + 2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const m = Math.hypot(nx, ny, nz) || 1, o = (j * cols + i) * 3;
    N[o] = nx / m; N[o + 1] = ny / m; N[o + 2] = nz / m;
  }
}

function render() {
  const sc = hexRGB(CONFIG.colors.stage);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(sc[0], sc[1], sc[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  computeNormals();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, P);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufNrm); gl.bufferSubData(gl.ARRAY_BUFFER, 0, N);
  gl.useProgram(prog); gl.uniform2f(U.uRes, vw, vh);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.drawElements(gl.TRIANGLES, idxCount, gl.UNSIGNED_SHORT, 0);
}

/* ---------- 2D fallback when WebGL2 is missing ---------- */
function draw2D() {
  const c = cv.getContext("2d"); if (!c) return;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = CONFIG.colors.stage; c.fillRect(0, 0, vw, vh);
  c.drawImage(tex2d, px, py, pw, ph);
}

/* ============================== INPUT ============================== */
function bindInput() {
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    ptr.x = ptr.lx = e.clientX; ptr.y = ptr.ly = e.clientY; ptr.has = true;
    startGrab(e.clientX, e.clientY);
  });
  cv.addEventListener("pointermove", e => {
    const vx = e.clientX - ptr.x, vy = e.clientY - ptr.y;
    ptr.x = e.clientX; ptr.y = e.clientY;
    if (grab) { grab.dx = ptr.x - grab.sx; grab.dy = ptr.y - grab.sy; }
    else if (e.pointerType === "mouse" && e.buttons === 0) hover(ptr.x, ptr.y, vx, vy);
  });
  const up = e => { grab = null; try { cv.releasePointerCapture(e.pointerId); } catch (_) {} };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
  const fi = document.getElementById("file");
  document.getElementById("replace").addEventListener("click", () => fi.click());
  fi.addEventListener("change", () => { loadFile(fi.files[0]); fi.value = ""; });

  let rt = 0;
  window.addEventListener("resize", () => {
    cancelAnimationFrame(rt);
    rt = requestAnimationFrame(() => { layout(); buildTexture(); if (gl) { uploadTexture(); initSim(); } else draw2D(); });
  });
}

/* ============================== LOOP ============================== */
let last = 0, acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = 0; return; }
  if (!last) last = t;
  acc = Math.min(acc + (t - last) / 1000, 0.05); last = t;
  while (acc >= 1 / 60) { step(); acc -= 1 / 60; }
  render();
}

function fontsReady() {
  const f = Promise.all([
    document.fonts.load('300 40px "Cormorant Garamond"'), document.fonts.load('400 20px "Cormorant Garamond"'),
    document.fonts.load('500 12px Inter'), document.fonts.load('600 12px Inter')
  ]).catch(() => {});
  return Promise.race([f, new Promise(r => setTimeout(r, 1500))]);
}

async function start() {
  layout();
  bindInput();
  const src = CONFIG.artwork.src || (CONFIG.artwork.type === "image" ? BUNDLED : "");
  await Promise.all([fontsReady(), new Promise(r => loadArtwork(src, r))]);
  buildTexture();
  if (!gl) { document.getElementById("msg").style.display = "block"; draw2D(); return; }
  try { initGL(); } catch (err) { console.error(err); document.getElementById("msg").style.display = "block"; return; }
  uploadTexture(); initSim();
  requestAnimationFrame(frame);
}
start();

})();
</script>
